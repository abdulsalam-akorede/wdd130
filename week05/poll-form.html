<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll-Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<header>
    <h1>WDD 130 | HTML Form - User Poll</h1>
</header>

<body>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname"> Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="usermail"> Email:</label>
                    <input type="email" id="usermail" name="usermail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="browser"> What's your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="1"> Chrome</option>
                        <option value="2"> Safari</option>
                        <option value="3"> Edge</option>
                        <option value="4"> Other</option>
                    </select>
                </div>

                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-item textarea-item">
                    <label for="feedback"> List the places you have lived </label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="Lagos, Abuja, London"></textarea>
                </div>
            </fieldset>

            <button type="submit"> Submit Poll</button>

        </form>
    </main>
    <footer>©2026 ✨Abdulsalam Akorede✨Lagos, Nigeria.
    </footer>
</body>

</html>

</html>
